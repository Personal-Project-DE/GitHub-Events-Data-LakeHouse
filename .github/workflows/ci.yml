name: CI Pipeline - GitHub Events Lakehouse

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main
      - 'phase-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-code-style:
    name: "Layer 1: Code Quality & Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.17.1

      - name: Run Ruff Lint Check
        run: ruff check . --output-format=github

      - name: Run Ruff Code Format Check
        run: ruff format --check .

  unit-and-regression-tests:
    name: "Layer 2: Unit Tests (Python ${{ matrix.python-version }})"
    needs: lint-and-code-style
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          TRINO_PORT: "8082"
          MINIO_HOST_ENDPOINT: "http://localhost:9010"
        run: |
          pytest -v --durations=10 tests/

  lakehouse-architecture-sanity:
    name: "Layer 3: Lakehouse Sanity & Configuration"
    needs: [lint-and-code-style, unit-and-regression-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python Compilation (No Syntax Errors)
        run: python -m compileall spark airflow tests

      - name: Verify Environment Example Integrity
        run: |
          test -f .env.example || (echo "Missing .env.example" && exit 1)
          grep -q "MINIO_ENDPOINT" .env.example || (echo "MINIO_ENDPOINT missing from .env.example" && exit 1)
          grep -q "SPARK_MASTER_URL" .env.example || (echo "SPARK_MASTER_URL missing from .env.example" && exit 1)
          grep -q "TRINO_PORT" .env.example || (echo "TRINO_PORT missing from .env.example" && exit 1)
          echo "Verified required environment variables are documented in .env.example."

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env 2>/dev/null || true
          docker compose config --quiet

  ci-gate-approval:
    name: "Layer 4: CI Quality Gate Final Verification"
    needs: [lint-and-code-style, unit-and-regression-tests, lakehouse-architecture-sanity]
    runs-on: ubuntu-latest
    steps:
      - name: CI Verification Summary
        run: |
          echo "============================================================"
          echo "  ALL CI/CD VERIFICATION LAYERS PASSED SUCCESSFULLY!        "
          echo "  - Layer 1: Code Quality & Linting (Ruff)"
          echo "  - Layer 2: Unit & Regression Tests across Python matrix"
          echo "  - Layer 3: Architecture, Syntax & Docker Configuration"
          echo "============================================================"
