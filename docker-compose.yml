services:
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  mc:
    image: minio/mc:latest
    container_name: lakehouse-mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse-net
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set minio http://minio:9000 $${MINIO_ROOT_USER:-admin} $${MINIO_ROOT_PASSWORD:-password123}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb minio/lakehouse --ignore-existing;
      /usr/bin/mc anonymous set public minio/lakehouse;
      echo 'Bucket lakehouse initialized successfully';
      exit 0;
      "
    restart: "no"

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: lakehouse-iceberg-rest
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${REST_CATALOG_PORT:-8181}:8181"
    environment:
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE_LOCATION:-s3a://lakehouse/warehouse}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-admin123}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_JDBC_BUSY_TIMEOUT: "60000"
    networks:
      - lakehouse-net

  spark-master:
    image: apache/spark:3.5.3
    container_name: lakehouse-spark-master
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-password123}
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_WEBUI_PORT:-8088}:8080"
    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./tests:/opt/spark/work-dir/tests
      - ./data:/opt/spark/work-dir/data
    networks:
      - lakehouse-net

  spark-worker:
    image: apache/spark:3.5.3
    container_name: lakehouse-spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-password123}
    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./tests:/opt/spark/work-dir/tests
      - ./data:/opt/spark/work-dir/data
    networks:
      - lakehouse-net

  trino:
    image: trinodb/trino:468
    container_name: lakehouse-trino
    restart: unless-stopped
    depends_on:
      - iceberg-rest
      - minio
    ports:
      - "${TRINO_PORT:-8082}:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    networks:
      - lakehouse-net

  postgres:
    image: postgres:17-alpine
    container_name: lakehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-admin}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-admin123}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-admin} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.2}
    container_name: lakehouse-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-admin}:${AIRFLOW_DB_PASSWORD:-admin123}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin123}
    networks:
      - lakehouse-net
    restart: "no"

  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.2}
    container_name: lakehouse-airflow-webserver
    restart: unless-stopped
    group_add:
      - "0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-admin}:${AIRFLOW_DB_PASSWORD:-admin123}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-lakehouse_jwt_secret_key_fixed_32_bytes_12345}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-lakehouse_secret_key_12345}
      WORKSPACE_ROOT: /opt/spark/work-dir
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-admin123}
      REST_CATALOG_URI: http://iceberg-rest:8181
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "${AIRFLOW_PORT:-8085}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/simple_auth_manager_passwords.json.generated:/opt/airflow/simple_auth_manager_passwords.json.generated
      - ./spark:/opt/spark/work-dir/spark
      - ./tests:/opt/spark/work-dir/tests
      - ./data:/opt/spark/work-dir/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: api-server
    networks:
      - lakehouse-net

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.2}
    container_name: lakehouse-airflow-scheduler
    restart: unless-stopped
    group_add:
      - "0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-admin}:${AIRFLOW_DB_PASSWORD:-admin123}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-lakehouse_jwt_secret_key_fixed_32_bytes_12345}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-lakehouse_secret_key_12345}
      WORKSPACE_ROOT: /opt/spark/work-dir
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-admin123}
      REST_CATALOG_URI: http://iceberg-rest:8181
      SPARK_MASTER_URL: spark://spark-master:7077
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/simple_auth_manager_passwords.json.generated:/opt/airflow/simple_auth_manager_passwords.json.generated
      - ./spark:/opt/spark/work-dir/spark
      - ./tests:/opt/spark/work-dir/tests
      - ./data:/opt/spark/work-dir/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    networks:
      - lakehouse-net

  metabase:
    image: metabase/metabase:v0.50.28
    container_name: lakehouse-metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
      - ./metabase/plugins/starburst-6.1.0.metabase-driver.jar:/plugins/starburst-6.1.0.metabase-driver.jar
    networks:
      - lakehouse-net
    depends_on:
      - trino

networks:
  lakehouse-net:
    driver: bridge

volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local
  metabase_data:
    driver: local
